<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="45" y1="215" x2="440" y2="215" stroke="#334155" stroke-width="1.4"/>
  <line x1="45" y1="20" x2="45" y2="225" stroke="#334155" stroke-width="1.4"/>
  <polygon points="440,215 430,211 430,219" fill="#334155"/>
  <polygon points="45,20 41,30 49,30" fill="#334155"/>
  <text x="443" y="229" font-size="12" fill="#334155">x</text>
  <text x="50" y="30" font-size="12" fill="#334155">y</text>
  <!-- orthogonal trajectories of y = c x^2 : the ellipses x^2 + 2 y^2 = C -->
  <ellipse cx="235" cy="118" rx="120" ry="85" fill="none" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="235" cy="118" rx="75" ry="53" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- parabolas y = c x^2 (the original family) -->
  <path d="M115,118 C155,110 200,80 250,30" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <path d="M355,118 C315,110 270,80 220,30" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <path d="M165,118 C200,114 235,95 275,55" fill="none" stroke="#0ea5e9" stroke-width="1.6" stroke-opacity="0.6"/>
  <path d="M305,118 C270,114 235,95 195,55" fill="none" stroke="#0ea5e9" stroke-width="1.6" stroke-opacity="0.6"/>
  <!-- legend -->
  <text x="300" y="215" font-size="12" fill="#0ea5e9">y = c x²</text>
  <text x="300" y="232" font-size="12" fill="#16a34a">x² + 2y² = C</text>
  <text x="45" y="245" font-size="11" fill="#475569">Each parabola meets each ellipse at right angles — orthogonal trajectories.</text>
</svg>
