<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">n</text>
  <text x="46" y="30" font-size="12" fill="#334155">aₙ</text>
  <!-- AP line -->
  <line x1="60" y1="180" x2="380" y2="40" stroke="#0ea5e9" stroke-width="2.2"/>
  <text x="386" y="46" font-size="12" fill="#0369a1">AP</text>
  <text x="300" y="66" font-size="10" fill="#0369a1">aₙ = a + (n−1)d</text>
  <!-- GP curve (exponential) -->
  <path d="M60,192 C120,188 180,150 240,96 C300,50 340,36 380,30" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="386" y="32" font-size="12" fill="#dc2626">GP</text>
  <text x="300" y="96" font-size="10" fill="#b91c1c">aₙ = a rⁿ⁻¹</text>
  <!-- AGP curve -->
  <path d="M60,196 C130,190 200,168 270,120 C330,80 360,58 380,46" fill="none" stroke="#16a34a" stroke-width="2.2"/>
  <text x="386" y="76" font-size="12" fill="#15803d">AGP</text>
  <text x="300" y="128" font-size="10" fill="#15803d">(a+kd) rᵏ</text>
  <!-- growth annotations -->
  <text x="60" y="228" font-size="11" fill="#475569">AP grows by addition (linear); GP by multiplication (exponential);</text>
  <text x="60" y="244" font-size="11" fill="#475569">AGP by both — its sum needs the shift-and-subtract trick.</text>
</svg>
