<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="30" y1="140" x2="450" y2="140" stroke="#334155" stroke-width="1.2"/>
  <line x1="60" y1="230" x2="60" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="450,140 442,136 442,144" fill="#334155"/>
  <polygon points="60,20 56,29 64,29" fill="#334155"/>
  <text x="452" y="156" font-size="12" fill="#334155">x</text>
  <text x="66" y="30" font-size="12" fill="#334155">y</text>
  <!-- line 3x + 4y = 0  (through the origin, slope -3/4) -->
  <line x1="20" y1="119" x2="265" y2="247" stroke="#0ea5e9" stroke-width="2.2"/>
  <text x="272" y="243" font-size="12" fill="#0ea5e9">3x + 4y = 0</text>
  <!-- point P = (4,3) -->
  <circle cx="220" cy="56" r="4" fill="#0f172a"/>
  <text x="226" y="52" font-size="12" fill="#0f172a">P(4, 3)</text>
  <!-- perpendicular from P to the line; foot = (28/25, -21/25) -->
  <line x1="220" y1="56" x2="105" y2="163" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3"/>
  <circle cx="105" cy="163" r="3.5" fill="#dc2626"/>
  <text x="112" y="180" font-size="11" fill="#dc2626">foot</text>
  <!-- right-angle marker -->
  <path d="M118,148 L128,156 L118,164" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <text x="150" y="120" font-size="11" fill="#dc2626">perpendicular distance</text>
  <text x="150" y="136" font-size="11" fill="#334155">|3(4)+4(3)| / 5 = 24/5 = 4.8</text>
  <text x="30" y="245" font-size="11" fill="#475569">Distance from a point to a line is measured along the perpendicular.</text>
</svg>
