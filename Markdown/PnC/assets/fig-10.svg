<svg viewBox="0 0 640 240" width="640" role="img" aria-label="Pascal's triangle with the hockey-stick diagonal highlighted">
        <style>
          .pv { font: 600 13px "Segoe UI", sans-serif; fill: #2a3550; }
          .ph { font: 700 13px "Segoe UI", sans-serif; fill: #fff; }
          .pa { stroke: #6d3fd4; stroke-width: 2; fill: none; }
          .pl { font: 600 11px "Segoe UI", sans-serif; fill: #6d3fd4; }
        </style>
        <!-- triangle entries: row n, entry r -->
        <!-- n=0 -->
        <text class="pv" x="310" y="30" text-anchor="middle">1</text>
        <!-- n=1 -->
        <text class="pv" x="270" y="62" text-anchor="middle">1</text>
        <text class="pv" x="350" y="62" text-anchor="middle">1</text>
        <!-- n=2 -->
        <text class="pv" x="230" y="94" text-anchor="middle">1</text>
        <text class="pv" x="310" y="94" text-anchor="middle">2</text>
        <text class="pv" x="390" y="94" text-anchor="middle">1</text>
        <!-- n=3 -->
        <text class="pv" x="190" y="126" text-anchor="middle">1</text>
        <text class="pv" x="270" y="126" text-anchor="middle">3</text>
        <text class="pv" x="350" y="126" text-anchor="middle">3</text>
        <text class="pv" x="430" y="126" text-anchor="middle">1</text>
        <!-- n=4 -->
        <text class="pv" x="150" y="158" text-anchor="middle">1</text>
        <text class="pv" x="230" y="158" text-anchor="middle">4</text>
        <text class="pv" x="310" y="158" text-anchor="middle">6</text>
        <text class="pv" x="390" y="158" text-anchor="middle">4</text>
        <text class="pv" x="470" y="158" text-anchor="middle">1</text>
        <!-- n=5 -->
        <text class="pv" x="110" y="190" text-anchor="middle">1</text>
        <text class="pv" x="190" y="190" text-anchor="middle">5</text>
        <text class="pv" x="270" y="190" text-anchor="middle">10</text>
        <text class="pv" x="350" y="190" text-anchor="middle">10</text>
        <text class="pv" x="430" y="190" text-anchor="middle">5</text>
        <text class="pv" x="510" y="190" text-anchor="middle">1</text>
        <!-- n=6 -->
        <text class="pv" x="70" y="222" text-anchor="middle">1</text>
        <text class="pv" x="150" y="222" text-anchor="middle">6</text>
        <text class="pv" x="230" y="222" text-anchor="middle">15</text>
        <text class="pv" x="310" y="222" text-anchor="middle">20</text>
        <text class="pv" x="390" y="222" text-anchor="middle">15</text>
        <text class="pv" x="470" y="222" text-anchor="middle">6</text>
        <text class="pv" x="550" y="222" text-anchor="middle">1</text>
        <!-- diagonal arrows (hockey stick: sum of C(1,1)+C(2,1)+C(3,1)+C(4,1) = 10 = C(5,2)) -->
        <path class="pa" d="M 238 86 L 238 164" marker-end="url(#mm-pnc-03-combinations-html-arrP)"/>
        <path class="pa" d="M 238 164 L 262 184" marker-end="url(#mm-pnc-03-combinations-html-arrP)"/>
        <text class="pl" x="500" y="80">diagonal sums:</text>
        <text class="pl" x="500" y="100">1+2+3+4 = 10 = C(5,2)</text>
        <defs>
          <marker id="mm-pnc-03-combinations-html-arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3fd4"/>
          </marker>
        </defs>
      </svg>