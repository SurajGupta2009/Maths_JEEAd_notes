<svg viewBox="0 0 620 240" width="620" role="img" aria-label="Values of D_n">
        <style>
          .dx { font: 600 12.5px "Segoe UI", sans-serif; fill: #2a3550; }
          .dh { font: 700 12px "Segoe UI", sans-serif; fill: #fff; }
        </style>
        <g>
          <rect x="10" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="53" y="43" text-anchor="middle">n = 0</text>
          <rect x="104" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="147" y="43" text-anchor="middle">n = 1</text>
          <rect x="198" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="241" y="43" text-anchor="middle">n = 2</text>
          <rect x="292" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="335" y="43" text-anchor="middle">n = 3</text>
          <rect x="386" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="429" y="43" text-anchor="middle">n = 4</text>
          <rect x="480" y="18" width="86" height="40" rx="8" fill="#eef1fd" stroke="#c9d4f7"/><text class="dh" x="523" y="43" text-anchor="middle">n = 5</text>
          <text class="dx" x="53" y="86" text-anchor="middle">Dₙ = 1</text>
          <text class="dx" x="147" y="86" text-anchor="middle">0</text>
          <text class="dx" x="241" y="86" text-anchor="middle">1</text>
          <text class="dx" x="335" y="86" text-anchor="middle">2</text>
          <text class="dx" x="429" y="86" text-anchor="middle">9</text>
          <text class="dx" x="523" y="86" text-anchor="middle">44</text>
          <text class="dx" x="310" y="125" text-anchor="middle">(check: D₅ = 4·(D₄ + D₃) = 4·11 = 44 ✓)</text>
          <rect x="10" y="150" width="596" height="66" rx="10" fill="#f3efff" stroke="#d9ccf8"/>
          <text x="24" y="176" style="font:600 12.5px 'Segoe UI',sans-serif; fill:#6d3fd4;">Dₙ = nearest integer to n!/e :   2!/e = 0.74 → 1 ✓   3!/e = 2.24 → 2 ✓</text>
          <text x="24" y="200" style="font:600 12.5px 'Segoe UI',sans-serif; fill:#6d3fd4;">4!/e = 9.06 → 9 ✓   5!/e = 44.14 → 44 ✓    — the exponential series hides inside a seating problem</text>
        </g>
      </svg>