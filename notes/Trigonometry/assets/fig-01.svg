<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- unit circle -->
  <circle cx="150" cy="130" r="100" fill="none" stroke="#334155" stroke-width="1.4"/>
  <!-- axes -->
  <line x1="30" y1="130" x2="380" y2="130" stroke="#334155" stroke-width="1.1"/>
  <line x1="150" y1="245" x2="150" y2="15" stroke="#334155" stroke-width="1.1"/>
  <polygon points="380,130 372,126 372,134" fill="#334155"/>
  <polygon points="150,15 146,24 154,24" fill="#334155"/>
  <text x="384" y="134" font-size="12" fill="#334155">x</text>
  <text x="154" y="24" font-size="12" fill="#334155">y</text>
  <!-- quadrant arcs / labels -->
  <text x="215" y="60" font-size="12" fill="#16a34a">I  + + +</text>
  <text x="80" y="60" font-size="12" fill="#dc2626">II  + − −</text>
  <text x="80" y="215" font-size="12" fill="#dc2626">III  − − +</text>
  <text x="215" y="215" font-size="12" fill="#16a34a">IV  − + −</text>
  <!-- point on circle at theta -->
  <line x1="150" y1="130" x2="240" y2="60" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="240" cy="60" r="4" fill="#0ea5e9"/>
  <text x="248" y="56" font-size="12" fill="#0369a1">(cos θ, sin θ)</text>
  <!-- cos projection -->
  <line x1="150" y1="130" x2="240" y2="130" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="185" y="148" font-size="11" fill="#15803d">cos θ</text>
  <!-- sin projection -->
  <line x1="240" y1="60" x2="240" y2="130" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="246" y="100" font-size="11" fill="#7e22ce">sin θ</text>
  <!-- angle arc -->
  <path d="M200,130 A50,50 0 0 0 192,102" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="203" y="122" font-size="12" fill="#475569">θ</text>
  <!-- right side: allied angle rules -->
  <text x="300" y="60" font-size="11" fill="#0f172a">Allied-angle rules</text>
  <text x="300" y="78" font-size="10.5" fill="#475569">sin(90°−θ) = cos θ</text>
  <text x="300" y="94" font-size="10.5" fill="#475569">cos(90°−θ) = sin θ</text>
  <text x="300" y="110" font-size="10.5" fill="#475569">sin(180°−θ) = sin θ</text>
  <text x="300" y="126" font-size="10.5" fill="#475569">cos(180°−θ) = −cos θ</text>
  <text x="300" y="142" font-size="10.5" fill="#475569">sin(180°+θ) = −sin θ</text>
  <text x="300" y="158" font-size="10.5" fill="#475569">cos(180°+θ) = −cos θ</text>
  <text x="300" y="180" font-size="10.5" fill="#0f172a">Odd 90°: swap sin/cos</text>
  <text x="300" y="196" font-size="10.5" fill="#0f172a">Even 90°: signs only</text>
  <text x="30" y="248" font-size="10.5" fill="#475569">Coordinates on the unit circle are (cos θ, sin θ); sin²θ + cos²θ = 1 is just its equation.</text>
</svg>
