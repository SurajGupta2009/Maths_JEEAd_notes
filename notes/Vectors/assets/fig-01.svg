<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="150" y2="235" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <polygon points="150,235 141,232 144,224" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <text x="152" y="240" font-size="12" fill="#334155">z</text>
  <!-- vector a in the xy-plane -->
  <line x1="40" y1="200" x2="200" y2="140" stroke="#0ea5e9" stroke-width="2.6"/>
  <polygon points="200,140 188,142 192,152" fill="#0ea5e9"/>
  <text x="205" y="136" font-size="13" fill="#0ea5e9">a</text>
  <!-- vector b -->
  <line x1="40" y1="200" x2="290" y2="90" stroke="#16a34a" stroke-width="2.6"/>
  <polygon points="290,90 277,95 283,104" fill="#16a34a"/>
  <text x="295" y="86" font-size="13" fill="#16a34a">b</text>
  <!-- parallelogram: a + b -->
  <line x1="200" y1="140" x2="450" y2="30" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="290" y1="90" x2="450" y2="30" stroke="#0ea5e9" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="200,140 290,90 450,30 360,80" fill="#16a34a" fill-opacity="0.10" stroke="none"/>
  <line x1="40" y1="200" x2="450" y2="30" stroke="#dc2626" stroke-width="2.6"/>
  <polygon points="450,30 435,38 441,46" fill="#dc2626"/>
  <text x="420" y="26" font-size="13" fill="#dc2626">a + b</text>
  <!-- a - b -->
  <line x1="290" y1="90" x2="200" y2="140" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="236" y="126" font-size="12" fill="#7e22ce">a − b</text>
  <!-- angle arc -->
  <path d="M120,200 A80,80 0 0 1 138,168" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="126" y="216" font-size="12" fill="#475569">θ</text>
  <text x="40" y="248" font-size="11" fill="#475569">Addition is tip-to-tail; the shaded parallelogram has area |a × b|.</text>
</svg>
