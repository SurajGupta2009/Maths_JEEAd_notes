<svg viewBox="0 0 620 330" width="620" role="img" aria-label="Decision tree for two-step choices">
        <style>
          .tn { font: 600 13px "Segoe UI", sans-serif; fill:#fff; }
          .tl { font: 500 12px "Segoe UI", sans-serif; fill:#46506a; }
          .te { stroke:#94a3b8; stroke-width:1.4; fill:none; }
          .tc { font: 700 13px "Segoe UI", sans-serif; fill:#2a3550; }
        </style>
        <text class="tc" x="310" y="20" text-anchor="middle">Pick a color (3 choices), then a font (2 choices)</text>
        <circle cx="310" cy="60" r="16" fill="#364fc7"/>
        <text class="tn" x="310" y="65" text-anchor="middle">start</text>
        <!-- level 1 -->
        <line class="te" x1="310" y1="76" x2="150" y2="128"/>
        <line class="te" x1="310" y1="76" x2="310" y2="128"/>
        <line class="te" x1="310" y1="76" x2="470" y2="128"/>
        <circle cx="150" cy="140" r="14" fill="#0b8f7a"/>
        <text class="tn" x="150" y="145" text-anchor="middle">red</text>
        <circle cx="310" cy="140" r="14" fill="#0b8f7a"/>
        <text class="tn" x="310" y="145" text-anchor="middle">blue</text>
        <circle cx="470" cy="140" r="14" fill="#0b8f7a"/>
        <text class="tn" x="470" y="145" text-anchor="middle">black</text>
        <!-- level 2 -->
        <line class="te" x1="150" y1="154" x2="105" y2="206"/>
        <line class="te" x1="150" y1="154" x2="195" y2="206"/>
        <line class="te" x1="310" y1="154" x2="265" y2="206"/>
        <line class="te" x1="310" y1="154" x2="355" y2="206"/>
        <line class="te" x1="470" y1="154" x2="425" y2="206"/>
        <line class="te" x1="470" y1="154" x2="515" y2="206"/>
        <rect x="63" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="105" y="227" text-anchor="middle">red·bold</text>
        <rect x="153" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="195" y="227" text-anchor="middle">red·ital</text>
        <rect x="223" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="265" y="227" text-anchor="middle">blue·bold</text>
        <rect x="313" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="355" y="227" text-anchor="middle">blue·ital</text>
        <rect x="383" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="425" y="227" text-anchor="middle">blk·bold</text>
        <rect x="473" y="210" width="84" height="26" rx="8" fill="#eef1fd" stroke="#c9d4f7"/>
        <text class="tl" x="515" y="227" text-anchor="middle">blk·ital</text>
        <text class="tc" x="310" y="272" text-anchor="middle">6 leaves = 3 × 2 — every leaf is a distinct outcome,</text>
        <text class="tc" x="310" y="290" text-anchor="middle">and every outcome has exactly one leaf</text>
      </svg>