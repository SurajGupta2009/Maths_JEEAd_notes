<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- sample space -->
  <rect x="30" y="30" width="270" height="180" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="38" y="46" font-size="12" fill="#334155">S (all outcomes)</text>

  <!-- B circle -->
  <circle cx="170" cy="130" r="72" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="196" y="88" font-size="12" fill="#0369a1">B</text>
  <!-- A circle -->
  <circle cx="130" cy="140" r="62" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.6"/>
  <text x="86" y="94" font-size="12" fill="#b91c1c">A</text>

  <!-- intersection label -->
  <text x="140" y="150" font-size="11.5" fill="#7c2d12">A ∩ B</text>
  <!-- only-A label -->
  <text x="86" y="176" font-size="11" fill="#b91c1c">A \ B</text>
  <!-- only-B label -->
  <text x="196" y="168" font-size="11" fill="#0369a1">B \ A</text>

  <!-- shrinking brace / arrow to the restricted world -->
  <path d="M 300 130 L 336 130" stroke="#475569" stroke-width="1.2"/>
  <polygon points="344,130 336,126 336,134" fill="#475569"/>

  <!-- restricted sample space = B -->
  <rect x="352" y="30" width="88" height="180" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="1.4"/>
  <text x="358" y="48" font-size="11.5" fill="#0369a1">the world of B</text>
  <!-- A∩B region inside B -->
  <ellipse cx="396" cy="120" rx="30" ry="40" fill="#dc2626" fill-opacity="0.22" stroke="#dc2626" stroke-width="1.4"/>
  <text x="374" y="124" font-size="10.5" fill="#7c2d12">A∩B</text>

  <!-- formula block -->
  <text x="30" y="228" font-size="12" fill="#0f172a">P(A | B) = P(A ∩ B) / P(B)</text>
  <text x="30" y="244" font-size="11" fill="#475569">Given B happened, B becomes the whole sample space — A is counted only inside it.</text>
</svg>
