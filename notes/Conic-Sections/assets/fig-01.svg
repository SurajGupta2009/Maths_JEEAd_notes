<svg viewBox="0 0 860 300" width="860" role="img" aria-label="Roadmap of the Conic Sections module">
        <defs>
          <marker id="mm-conic-sections-index-html-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#364fc7"/>
          </marker>
        </defs>
        <style>
          .rc { font: 600 14px "Segoe UI", sans-serif; fill: #fff; }
          .rt { font: 600 12.5px "Segoe UI", sans-serif; fill: #2a3550; }
          .rd { font: 400 10.5px "Segoe UI", sans-serif; fill: #6b7690; }
          .el { stroke: #364fc7; stroke-width: 1.6; fill: none; }
        </style>
        <!-- row 1: chapters 1–3 -->
        <rect x="10" y="16" width="250" height="58" rx="12" fill="#0b8f7a"/>
        <text class="rc" x="135" y="40" text-anchor="middle">01 · The Conic Family</text>
        <text class="rc" x="135" y="58" text-anchor="middle" style="font-size:11px;">cone slices · focus-directrix · e</text>
        <rect x="305" y="16" width="250" height="58" rx="12" fill="#364fc7"/>
        <text class="rc" x="430" y="40" text-anchor="middle">02 · The Parabola</text>
        <text class="rc" x="430" y="58" text-anchor="middle" style="font-size:11px;">focal chords · three normals · reflection</text>
        <rect x="600" y="16" width="250" height="58" rx="12" fill="#364fc7"/>
        <text class="rc" x="725" y="40" text-anchor="middle">03 · The Ellipse</text>
        <text class="rc" x="725" y="58" text-anchor="middle" style="font-size:11px;">eccentric angle · director circle</text>
        <!-- row 2: chapters 4–6 -->
        <rect x="10" y="120" width="250" height="58" rx="12" fill="#364fc7"/>
        <text class="rc" x="135" y="144" text-anchor="middle">04 · The Hyperbola</text>
        <text class="rc" x="135" y="162" text-anchor="middle" style="font-size:11px;">asymptotes · conjugate · xy = c²</text>
        <rect x="305" y="120" width="250" height="58" rx="12" fill="#6d3fd4"/>
        <text class="rc" x="430" y="144" text-anchor="middle">05 · Tangents &amp; Polars</text>
        <text class="rc" x="430" y="162" text-anchor="middle" style="font-size:11px;">SS1 = T² · chord of contact · La Hire</text>
        <rect x="600" y="120" width="250" height="58" rx="12" fill="#6d3fd4"/>
        <text class="rc" x="725" y="144" text-anchor="middle">06 · Olympiad Frontier</text>
        <text class="rc" x="725" y="162" text-anchor="middle" style="font-size:11px;">confocals · nine-point circle · Simson</text>
        <!-- arrows -->
        <line class="el" x1="260" y1="45" x2="305" y2="45" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <line class="el" x1="555" y1="45" x2="600" y2="45" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <path class="el" d="M 135 74 C 135 100, 135 90, 135 120" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <line class="el" x1="260" y1="149" x2="305" y2="149" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <line class="el" x1="555" y1="149" x2="600" y2="149" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <!-- paper -->
        <rect x="300" y="228" width="260" height="54" rx="12" fill="#c2255c"/>
        <text class="rc" x="430" y="250" text-anchor="middle">Olympiad Paper · 38 questions</text>
        <text class="rc" x="430" y="268" text-anchor="middle" style="font-size:11px;">covers every concept of the module</text>
        <path class="el" d="M 430 178 C 430 200, 430 205, 430 228" marker-end="url(#mm-conic-sections-index-html-arr)"/>
        <text class="rd" x="845" y="290" text-anchor="end">locus → three curves → one toolkit → the frontier</text>
      </svg>