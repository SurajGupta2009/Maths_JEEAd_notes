<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- number line -->
  <line x1="30" y1="100" x2="450" y2="100" stroke="#334155" stroke-width="1.2"/>
  <polygon points="450,100 442,96 442,104" fill="#334155"/>
  <polygon points="30,100 38,96 38,104" fill="#334155"/>
  <!-- critical points for (x-1)(x-2)(x-3) -->
  <line x1="130" y1="92" x2="130" y2="108" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="230" y1="92" x2="230" y2="108" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="330" y1="92" x2="330" y2="108" stroke="#0f172a" stroke-width="1.6"/>
  <circle cx="130" cy="100" r="4" fill="#0f172a"/>
  <circle cx="230" cy="100" r="4" fill="#0f172a"/>
  <circle cx="330" cy="100" r="4" fill="#0f172a"/>
  <text x="124" y="126" font-size="12" fill="#0f172a">1</text>
  <text x="224" y="126" font-size="12" fill="#0f172a">2</text>
  <text x="324" y="126" font-size="12" fill="#0f172a">3</text>
  <!-- wavy curve: positive on (1,2) and (3,inf) -->
  <path d="M30,86 C80,120 110,132 130,124 C150,116 180,70 230,66 C280,62 300,130 330,126 C370,120 410,86 450,74"
        fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <!-- solution shading -->
  <rect x="130" y="146" width="100" height="10" fill="#16a34a" fill-opacity="0.25"/>
  <rect x="330" y="146" width="120" height="10" fill="#16a34a" fill-opacity="0.25"/>
  <!-- signs -->
  <text x="60" y="72" font-size="14" fill="#dc2626">−</text>
  <text x="160" y="48" font-size="14" fill="#16a34a">+</text>
  <text x="260" y="48" font-size="14" fill="#dc2626">−</text>
  <text x="380" y="48" font-size="14" fill="#16a34a">+</text>
  <!-- labels -->
  <text x="60" y="180" font-size="11" fill="#475569">(x−1)(x−2)(x−3) &gt; 0</text>
  <text x="60" y="196" font-size="11" fill="#475569">solution: (1, 2) ∪ (3, ∞)</text>
  <text x="60" y="218" font-size="11" fill="#475569">Alternate the sign at each simple root, starting from + at the right.</text>
  <text x="60" y="234" font-size="11" fill="#475569">Even-multiplicity roots do not change the sign.</text>
</svg>
