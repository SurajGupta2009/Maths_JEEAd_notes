<svg viewBox="0 0 560 300" width="560" role="img" aria-label="Reflection principle on a 3x3 grid">
        <style>
          .gg { stroke: #d5dcea; stroke-width: 1; }
          .gp { stroke: #364fc7; stroke-width: 2.2; fill: none; }
          .gb { stroke: #c2255c; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
          .gl { font: 600 11.5px "Segoe UI", sans-serif; fill: #46506a; }
          .gd { stroke: #6d3fd4; stroke-width: 1.6; stroke-dasharray: 3 4; }
        </style>
        <!-- grid -->
        <g>
          <line class="gg" x1="60" y1="240" x2="480" y2="240"/>
          <line class="gg" x1="60" y1="180" x2="480" y2="180"/>
          <line class="gg" x1="60" y1="120" x2="480" y2="120"/>
          <line class="gg" x1="60" y1="60" x2="480" y2="60"/>
          <line class="gg" x1="60" y1="240" x2="60" y2="60"/>
          <line class="gg" x1="165" y1="240" x2="165" y2="60"/>
          <line class="gg" x1="270" y1="240" x2="270" y2="60"/>
          <line class="gg" x1="375" y1="240" x2="375" y2="60"/>
          <line class="gg" x1="480" y1="240" x2="480" y2="60"/>
        </g>
        <!-- diagonal forbidden line y = x+1 (shifted): line from (60,120) to (375,60)? draw y = x+1 in grid coords: points (0,1),(1,2),(2,3): (60,180),(165,120),(270,60) extend -->
        <line class="gd" x1="20" y1="198" x2="330" y2="55"/>
        <text class="gl" x="24" y="190" fill="#6d3fd4">forbidden line</text>
        <!-- good path: RRUURR? (0,0)->(3,3) staying y&lt;=x: R R U R U R: (1,0),(2,0),(2,1),(3,1),(3,2),(3,3) -->
        <polyline class="gp" points="60,240 165,240 270,240 270,180 375,180 375,120 480,120"/>
        <text class="gl" x="488" y="124" fill="#364fc7">good</text>
        <!-- bad path: R U U R R U? (0,0),(1,0),(1,1),(1,2)... (1,2) is above y=x: first crossing at (1,2): prefix (0,0)->(1,0)->(1,1)->(1,2) -->
        <polyline class="gb" points="60,240 165,240 165,180 165,120 270,120 375,120 375,60 480,60"/>
        <text class="gl" x="488" y="64" fill="#c2255c">bad → reflected</text>
        <!-- reflection of prefix across y=x+1: (0,0)->(-1,1) in math coords; in svg: reflect prefix points (60,240),(165,240),(165,180),(165,120) across the line through (60,180),(165,120),(270,60)... show resulting start at (-1,1) i.e. svg (−45,180)? draw arrow from (60,240) region to (-45,180) -->
        <line x1="60" y1="240" x2="0" y2="180" stroke="#6d3fd4" stroke-width="1.4" stroke-dasharray="4 4"/>
        <circle cx="0" cy="180" r="5" fill="#6d3fd4"/>
        <text class="gl" x="8" y="205" fill="#6d3fd4">prefix reflected → starts at (−1, 1)</text>
        <!-- axis labels -->
        <text class="gl" x="30" y="262">O</text>
        <text class="gl" x="470" y="262">(3, 0)</text>
        <text class="gl" x="20" y="52">(0, 3)</text>
      </svg>