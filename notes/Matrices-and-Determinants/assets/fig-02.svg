<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- three panels -->
  <!-- Panel 1: unique solution (two crossing lines) -->
  <text x="30" y="26" font-size="12" fill="#16a34a">ρ(A) = ρ[A|B] = n  →  unique</text>
  <line x1="40" y1="70" x2="150" y2="30" stroke="#0ea5e9" stroke-width="1.8"/>
  <line x1="40" y1="30" x2="150" y2="70" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="95" cy="50" r="4" fill="#0f172a"/>
  <text x="88" y="90" font-size="11" fill="#475569">lines cross once</text>

  <!-- Panel 2: no solution (parallel lines) -->
  <text x="180" y="26" font-size="12" fill="#dc2626">ρ(A) ≠ ρ[A|B]  →  none</text>
  <line x1="190" y1="50" x2="300" y2="50" stroke="#0ea5e9" stroke-width="1.8"/>
  <line x1="190" y1="76" x2="300" y2="76" stroke="#dc2626" stroke-width="1.8"/>
  <text x="216" y="96" font-size="11" fill="#475569">parallel, never meet</text>

  <!-- Panel 3: infinitely many (coincident lines) -->
  <text x="330" y="26" font-size="12" fill="#a855f7">ρ(A) = ρ[A|B] &lt; n  →  ∞</text>
  <line x1="340" y1="50" x2="450" y2="50" stroke="#0ea5e9" stroke-width="1.8"/>
  <line x1="340" y1="50" x2="450" y2="50" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3"/>
  <circle cx="395" cy="50" r="4" fill="#0f172a"/>
  <text x="356" y="70" font-size="11" fill="#475569">same line</text>

  <!-- rank explanation -->
  <line x1="30" y1="120" x2="440" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="30" y="142" font-size="11.5" fill="#0f172a">ρ(A) = rank of the coefficient matrix</text>
  <text x="30" y="160" font-size="11.5" fill="#0f172a">ρ[A|B] = rank after appending the constants</text>
  <text x="30" y="182" font-size="11.5" fill="#475569">For n unknowns: equal ranks and = n gives one solution;</text>
  <text x="30" y="198" font-size="11.5" fill="#475569">equal ranks below n gives infinitely many; unequal gives none.</text>
  <text x="30" y="222" font-size="11.5" fill="#475569">A homogeneous system AX = 0 always has X = 0, and has a</text>
  <text x="30" y="238" font-size="11.5" fill="#475569">non-trivial solution exactly when det A = 0.</text>
</svg>
