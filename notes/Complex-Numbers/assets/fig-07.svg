<svg viewBox="0 0 620 320" width="620" role="img" aria-label="The fourth roots of 16 are a square of side 2root2 on the circle of radius 2">
        <style>
          .ax3 { stroke: #94a3b8; stroke-width: 1.4; }
          .ci3 { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
          .sq { stroke: #0b8f7a; stroke-width: 2; fill: rgba(11,143,122,.06); }
          .lb3 { font: 600 13px "Segoe UI", sans-serif; fill: #2a3550; }
          .ls3 { font: 500 12px "Segoe UI", sans-serif; fill: #7a83a5; }
          .lt { font: 600 13px "Segoe UI", sans-serif; fill: #0b8f7a; }
        </style>
        <!-- origin 310,160; 1 unit = 60 px -->
        <line class="ax3" x1="40" y1="160" x2="580" y2="160"/>
        <line class="ax3" x1="310" y1="300" x2="310" y2="20"/>
        <text class="ls3" x="562" y="152">Re</text>
        <text class="ls3" x="318" y="32">Im</text>
        <circle class="ci3" cx="310" cy="160" r="120"/>
        <rect class="sq" x="310" y="40" width="120" height="120"/>
        <rect class="sq" x="190" y="40" width="120" height="120"/>
        <rect class="sq" x="190" y="160" width="120" height="120"/>
        <rect class="sq" x="310" y="160" width="120" height="120"/>
        <circle cx="430" cy="160" r="5" fill="#0b8f7a"/>
        <circle cx="310" cy="40" r="5" fill="#0b8f7a"/>
        <circle cx="190" cy="160" r="5" fill="#0b8f7a"/>
        <circle cx="310" cy="280" r="5" fill="#0b8f7a"/>
        <circle cx="310" cy="160" r="4" fill="#2a3550"/>
        <text class="lt" x="440" y="152">2</text>
        <text class="lt" x="320" y="34">2i</text>
        <text class="lt" x="140" y="152">−2</text>
        <text class="lt" x="320" y="298">−2i</text>
        <text class="ls3" x="70" y="240">z⁴ = 16: four roots, one square —</text>
        <text class="ls3" x="70" y="258">radius 2, consecutive angles 2π/4 = 90° apart</text>
      </svg>