<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="50" y1="210" x2="450" y2="210" stroke="#334155" stroke-width="1.4"/>
  <line x1="50" y1="20" x2="50" y2="225" stroke="#334155" stroke-width="1.4"/>
  <polygon points="450,210 440,206 440,214" fill="#334155"/>
  <polygon points="50,20 46,30 54,30" fill="#334155"/>
  <text x="452" y="224" font-size="12" fill="#334155">x</text>
  <text x="56" y="30" font-size="12" fill="#334155">y</text>
  <!-- f(t) = 2t : straight line from (0,0) to (2,4) -->
  <line x1="50" y1="210" x2="270" y2="42" stroke="#0ea5e9" stroke-width="2.2"/>
  <text x="280" y="40" font-size="12" fill="#0ea5e9">f(t) = 2t</text>
  <!-- accumulated area A(x) = x^2 for 0 <= x <= 1 : triangle -->
  <polygon points="50,210 160,210 160,126" fill="#0ea5e9" fill-opacity="0.18" stroke="#0369a1" stroke-width="1"/>
  <!-- accumulated area for 1 <= x <= 2 -->
  <polygon points="160,210 270,210 270,42" fill="#0ea5e9" fill-opacity="0.10" stroke="#0369a1" stroke-width="1" stroke-dasharray="5 3"/>
  <!-- the moving boundary at x -->
  <line x1="160" y1="210" x2="160" y2="126" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="160" cy="126" r="4" fill="#0f172a"/>
  <text x="166" y="120" font-size="12" fill="#0f172a">(x, f(x))</text>
  <text x="166" y="136" font-size="11" fill="#dc2626">boundary moves right</text>
  <!-- annotations -->
  <text x="70" y="160" font-size="11" fill="#0369a1">A(x) = ∫₀ˣ f(t) dt = x²</text>
  <text x="180" y="160" font-size="11" fill="#0369a1">dA/dx = f(x) = 2x</text>
  <text x="50" y="245" font-size="11" fill="#475569">Fundamental Theorem: the rate at which accumulated area grows is the height of the curve.</text>
</svg>
