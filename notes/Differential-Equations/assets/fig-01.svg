<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="45" y1="215" x2="440" y2="215" stroke="#334155" stroke-width="1.4"/>
  <line x1="45" y1="20" x2="45" y2="225" stroke="#334155" stroke-width="1.4"/>
  <polygon points="440,215 430,211 430,219" fill="#334155"/>
  <polygon points="45,20 41,30 49,30" fill="#334155"/>
  <text x="443" y="229" font-size="12" fill="#334155">x</text>
  <text x="50" y="30" font-size="12" fill="#334155">y</text>
  <!-- solution curves of dy/dx = x/y  (family y^2 - x^2 = C) -->
  <!-- C = -1 : y = +sqrt(x^2-1), x>=1 -->
  <path d="M120,215 C160,180 200,130 260,75 C300,40 340,20 370,20" fill="none" stroke="#0ea5e9" stroke-width="2.2"/>
  <!-- C = 1 : y = sqrt(x^2+1) -->
  <path d="M45,110 C90,105 140,95 200,72 C260,49 320,30 370,22" fill="none" stroke="#16a34a" stroke-width="2.2"/>
  <!-- C = 1 : lower branch y = -sqrt(x^2+1) -->
  <path d="M45,320 C90,325 140,335 200,358 C260,381 320,400 370,408" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-opacity="0.45"/>
  <!-- initial condition point (0,1) -->
  <circle cx="45" cy="110" r="4" fill="#0f172a"/>
  <text x="52" y="104" font-size="12" fill="#0f172a">y(0)=1</text>
  <!-- slope field hints -->
  <text x="250" y="240" font-size="11" fill="#475569">Slope field + one solution curve through the initial point.</text>
</svg>
