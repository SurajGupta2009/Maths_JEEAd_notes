<svg viewBox="0 0 620 300" width="620" role="img" aria-label="Multiplication by i rotates a point 90 degrees counterclockwise">
        <style>
          .ax2 { stroke: #94a3b8; stroke-width: 1.4; }
          .v2 { stroke: #0b8f7a; stroke-width: 2.2; fill: none; }
          .rot { stroke: #c2255c; stroke-width: 2.2; fill: none; }
          .arc { stroke: #6d3fd4; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
          .lb2 { font: 600 13px "Segoe UI", sans-serif; fill: #2a3550; }
          .ls2 { font: 500 12px "Segoe UI", sans-serif; fill: #7a83a5; }
          .lg2 { font: 600 13px "Segoe UI", sans-serif; fill: #0b8f7a; }
          .lm2 { font: 600 13px "Segoe UI", sans-serif; fill: #c2255c; }
        </style>
        <!-- origin at 310,160; 1 unit = 55 px -->
        <line class="ax2" x1="40" y1="160" x2="580" y2="160"/>
        <line class="ax2" x1="310" y1="270" x2="310" y2="30"/>
        <text class="ls2" x="560" y="152">Re</text>
        <text class="ls2" x="318" y="40">Im</text>
        <!-- P = (3,1) -> (475,105) ; iP = (-1,3) -> (255, -5)? 3 units up = 160-165 = -5; shift: use P=(2,1): (420,105); iP=(-1,2): (255,50) -->
        <line class="v2" x1="310" y1="160" x2="420" y2="105"/>
        <line class="rot" x1="310" y1="160" x2="255" y2="50"/>
        <path class="arc" d="M 420 105 A 123 123 0 0 0 255 50"/>
        <circle cx="420" cy="105" r="4.5" fill="#0b8f7a"/>
        <circle cx="255" cy="50" r="4.5" fill="#c2255c"/>
        <circle cx="310" cy="160" r="4" fill="#2a3550"/>
        <text class="lg2" x="430" y="100">z = 2+i</text>
        <text class="lm2" x="150" y="44">iz = −1+2i</text>
        <text class="ls2" x="330" y="150">×i  ⇒  90° CCW, same length</text>
        <text class="ls2" x="440" y="200">dot product (2,1)·(−1,2) = −2+2 = 0  ✓</text>
        <text class="ls2" x="70" y="245">|z| = √5 = |iz|  ✓</text>
      </svg>