<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <line x1="35" y1="215" x2="445" y2="215" stroke="#334155" stroke-width="1.4"/>
  <line x1="45" y1="20" x2="45" y2="225" stroke="#334155" stroke-width="1.4"/>
  <polygon points="445,215 435,211 435,219" fill="#334155"/>
  <polygon points="45,20 41,30 49,30" fill="#334155"/>
  <text x="448" y="229" font-size="12" fill="#334155">x</text>
  <text x="50" y="30" font-size="12" fill="#334155">y</text>
  <!-- curve y = x^2-ish (drawn as a parabola) -->
  <path d="M90,40 C160,120 250,180 360,205" fill="none" stroke="#0ea5e9" stroke-width="2.2"/>
  <!-- point P on curve -->
  <circle cx="250" cy="180" r="4" fill="#0f172a"/>
  <text x="256" y="176" font-size="12" fill="#0f172a">P</text>
  <!-- secants approaching tangent -->
  <line x1="120" y1="228" x2="380" y2="150" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="170" y1="228" x2="360" y2="160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="215" y1="228" x2="330" y2="167" stroke="#a855f7" stroke-width="1.6"/>
  <!-- tangent -->
  <line x1="150" y1="228" x2="400" y2="120" stroke="#16a34a" stroke-width="2.4"/>
  <text x="360" y="112" font-size="12" fill="#16a34a">tangent</text>
  <!-- Q points on curve -->
  <circle cx="360" cy="205" r="3" fill="#64748b"/>
  <circle cx="330" cy="196" r="3" fill="#64748b"/>
  <text x="300" y="240" font-size="11" fill="#475569">Secants through P → the tangent as Q → P; its slope is f′(x₀).</text>
</svg>
