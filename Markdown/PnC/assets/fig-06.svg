<svg viewBox="0 0 640 250" width="640" role="img" aria-label="Two linear seatings representing the same circular seating">
        <style>
          .pn { font: 700 13px "Segoe UI", sans-serif; fill: #fff; }
          .pl { font: 600 12px "Segoe UI", sans-serif; fill: #46506a; }
          .ps { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
        </style>
        <!-- table 1 -->
        <circle cx="140" cy="125" r="82" fill="none" stroke="#364fc7" stroke-width="2"/>
        <circle cx="140" cy="43" r="15" fill="#0b8f7a"/><text class="pn" x="140" y="48" text-anchor="middle">A</text>
        <circle cx="222" cy="125" r="15" fill="#364fc7"/><text class="pn" x="222" y="130" text-anchor="middle">B</text>
        <circle cx="140" cy="207" r="15" fill="#364fc7"/><text class="pn" x="140" y="212" text-anchor="middle">C</text>
        <circle cx="58" cy="125" r="15" fill="#364fc7"/><text class="pn" x="58" y="130" text-anchor="middle">D</text>
        <text class="pl" x="140" y="245" text-anchor="middle">clockwise: A, B, C, D</text>
        <!-- table 2 (rotated) -->
        <circle cx="470" cy="125" r="82" fill="none" stroke="#364fc7" stroke-width="2"/>
        <circle cx="552" cy="125" r="15" fill="#0b8f7a"/><text class="pn" x="552" y="130" text-anchor="middle">A</text>
        <circle cx="470" cy="207" r="15" fill="#364fc7"/><text class="pn" x="470" y="212" text-anchor="middle">B</text>
        <circle cx="388" cy="125" r="15" fill="#364fc7"/><text class="pn" x="388" y="130" text-anchor="middle">C</text>
        <circle cx="470" cy="43" r="15" fill="#364fc7"/><text class="pn" x="470" y="48" text-anchor="middle">D</text>
        <text class="pl" x="470" y="245" text-anchor="middle">clockwise: A, B, C, D — same seating!</text>
        <!-- equals -->
        <text x="310" y="132" text-anchor="middle" style="font:700 30px 'Segoe UI',sans-serif; fill:#c2255c;">=</text>
        <path class="ps" d="M 250 125 C 275 100, 285 100, 300 118" marker-end="url(#mm-pnc-02-permutations-html-arr)"/>
        <defs>
          <marker id="mm-pnc-02-permutations-html-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2255c"/>
          </marker>
        </defs>
      </svg>