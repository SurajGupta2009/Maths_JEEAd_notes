<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <text x="30" y="24" font-size="12" fill="#0f172a">Bayes' theorem — reverse the tree</text>

  <!-- root -->
  <circle cx="40" cy="120" r="4" fill="#334155"/>
  <text x="14" y="146" font-size="10.5" fill="#334155">start</text>

  <!-- branch A -->
  <line x1="44" y1="120" x2="170" y2="72" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="86" y="84" font-size="11" fill="#0369a1">A  (½)</text>
  <!-- branch B -->
  <line x1="44" y1="120" x2="170" y2="168" stroke="#dc2626" stroke-width="1.6"/>
  <text x="86" y="162" font-size="11" fill="#b91c1c">B  (½)</text>

  <!-- leaves: defective / ok -->
  <circle cx="176" cy="72" r="4" fill="#0ea5e9"/>
  <line x1="180" y1="72" x2="300" y2="46" stroke="#16a34a" stroke-width="1.4"/>
  <text x="200" y="48" font-size="10.5" fill="#15803d">bad (0.01)</text>
  <line x1="180" y1="72" x2="300" y2="96" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="206" y="94" font-size="10.5" fill="#475569">good (0.99)</text>

  <circle cx="176" cy="168" r="4" fill="#dc2626"/>
  <line x1="180" y1="168" x2="300" y2="142" stroke="#16a34a" stroke-width="1.4"/>
  <text x="200" y="144" font-size="10.5" fill="#15803d">bad (0.02)</text>
  <line x1="180" y1="168" x2="300" y2="192" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="206" y="190" font-size="10.5" fill="#475569">good (0.98)</text>

  <!-- reverse direction -->
  <line x1="30" y1="216" x2="440" y2="216" stroke="#334155" stroke-width="1"/>
  <text x="30" y="236" font-size="11" fill="#0f172a">P(A | bad) = 0.5·0.01 / (0.5·0.01 + 0.5·0.02) = 1/3</text>
  <text x="30" y="250" font-size="10.5" fill="#475569">The forward tree gives the branches; Bayes rescales them to the observed leaf.</text>
</svg>
