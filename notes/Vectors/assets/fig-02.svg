<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="150" y2="235" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <polygon points="150,235 141,232 144,224" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <text x="152" y="240" font-size="12" fill="#334155">z</text>
  <!-- a = (1,2,3) drawn along x-ish -->
  <line x1="40" y1="200" x2="190" y2="130" stroke="#0ea5e9" stroke-width="2.6"/>
  <polygon points="190,130 176,134 181,143" fill="#0ea5e9"/>
  <text x="196" y="126" font-size="13" fill="#0ea5e9">a</text>
  <!-- b = (4,5,6) -->
  <line x1="40" y1="200" x2="300" y2="80" stroke="#16a34a" stroke-width="2.6"/>
  <polygon points="300,80 286,86 292,94" fill="#16a34a"/>
  <text x="306" y="76" font-size="13" fill="#16a34a">b</text>
  <!-- c = a x b = (-3,6,-3): points up-left-ish, perpendicular to both -->
  <line x1="40" y1="200" x2="-30" y2="60" stroke="#dc2626" stroke-width="2.6"/>
  <!-- clamp: draw from origin toward (-3,6,-3) but keep on canvas: use reversed visual dir -->
  <line x1="40" y1="200" x2="20" y2="70" stroke="#dc2626" stroke-width="2.6"/>
  <polygon points="20,70 12,80 26,79" fill="#dc2626"/>
  <text x="24" y="60" font-size="13" fill="#dc2626">a × b</text>
  <!-- right-angle markers -->
  <path d="M96,150 L100,140 L110,146" fill="none" stroke="#475569" stroke-width="1.1"/>
  <path d="M62,132 L58,142 L48,136" fill="none" stroke="#475569" stroke-width="1.1"/>
  <text x="70" y="200" font-size="11" fill="#475569">a × b ⊥ a</text>
  <text x="70" y="214" font-size="11" fill="#475569">a × b ⊥ b</text>
  <text x="300" y="160" font-size="11" fill="#475569">|a × b| = |a||b| sin θ</text>
  <text x="300" y="176" font-size="11" fill="#475569">= area of the parallelogram</text>
  <text x="40" y="248" font-size="11" fill="#475569">The cross product is perpendicular to both factors — that is its defining geometric meaning.</text>
</svg>
