<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="180" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,180 432,176 432,184" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <text x="444" y="184" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <!-- x-axis division into three intervals by roots alpha < beta -->
  <line x1="140" y1="180" x2="140" y2="172" stroke="#334155" stroke-width="1.2"/>
  <line x1="330" y1="180" x2="330" y2="172" stroke="#334155" stroke-width="1.2"/>
  <text x="132" y="196" font-size="11" fill="#334155">α</text>
  <text x="322" y="196" font-size="11" fill="#334155">β</text>
  <!-- shaded region where expression is negative (a>0) -->
  <rect x="140" y="176" width="190" height="8" fill="#dc2626" fill-opacity="0.18"/>
  <!-- sign labels -->
  <text x="70" y="170" font-size="13" fill="#16a34a">+</text>
  <text x="225" y="170" font-size="13" fill="#dc2626">−</text>
  <text x="390" y="170" font-size="13" fill="#16a34a">+</text>
  <text x="70" y="152" font-size="10" fill="#15803d">ax²+bx+c &gt; 0</text>
  <text x="200" y="152" font-size="10" fill="#b91c1c">ax²+bx+c &lt; 0</text>
  <text x="378" y="152" font-size="10" fill="#15803d">ax²+bx+c &gt; 0</text>
  <!-- parabola sketch (a>0, opening up, below axis between roots) -->
  <path d="M70,150 Q140,300 210,250 Q300,180 390,150" fill="none" stroke="#0ea5e9" stroke-width="2.2"/>
  <circle cx="140" cy="178" r="3" fill="#0f172a"/>
  <circle cx="330" cy="178" r="3" fill="#0f172a"/>
  <text x="400" y="120" font-size="11" fill="#0369a1">a &gt; 0</text>
  <!-- rule box -->
  <text x="40" y="222" font-size="11" fill="#475569">For a &gt; 0: positive OUTSIDE the roots, negative BETWEEN them.</text>
  <text x="40" y="238" font-size="11" fill="#475569">For a &lt; 0 the pattern reverses. If D ≤ 0 and a &gt; 0, it is always ≥ 0.</text>
</svg>
