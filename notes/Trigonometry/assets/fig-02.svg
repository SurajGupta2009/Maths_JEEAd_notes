<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- unit circle -->
  <circle cx="150" cy="130" r="100" fill="none" stroke="#334155" stroke-width="1.4"/>
  <line x1="30" y1="130" x2="380" y2="130" stroke="#334155" stroke-width="1.1"/>
  <line x1="150" y1="245" x2="150" y2="15" stroke="#334155" stroke-width="1.1"/>
  <polygon points="380,130 372,126 372,134" fill="#334155"/>
  <polygon points="150,15 146,24 154,24" fill="#334155"/>
  <!-- horizontal line y = 1/2 -->
  <line x1="30" y1="80" x2="380" y2="80" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="384" y="84" font-size="11" fill="#dc2626">y = 1/2</text>
  <!-- intersection points -->
  <circle cx="236.6" cy="80" r="4.5" fill="#dc2626"/>
  <circle cx="63.4" cy="80" r="4.5" fill="#dc2626"/>
  <text x="242" y="74" font-size="12" fill="#dc2626">5π/6</text>
  <text x="40" y="74" font-size="12" fill="#dc2626">π/6</text>
  <!-- radii to the two points -->
  <line x1="150" y1="130" x2="236.6" y2="80" stroke="#0ea5e9" stroke-width="1.6"/>
  <line x1="150" y1="130" x2="63.4" y2="80" stroke="#0ea5e9" stroke-width="1.6"/>
  <!-- angle arcs -->
  <path d="M200,130 A50,50 0 0 0 193,105" fill="none" stroke="#475569" stroke-width="1.1"/>
  <text x="204" y="122" font-size="11" fill="#475569">30°</text>
  <path d="M100,130 A50,50 0 0 1 107,105" fill="none" stroke="#475569" stroke-width="1.1"/>
  <text x="78" y="122" font-size="11" fill="#475569">150°</text>
  <!-- right panel: the three standard general solutions -->
  <text x="300" y="45" font-size="11.5" fill="#0f172a">General solutions</text>
  <text x="300" y="66" font-size="10.5" fill="#475569">sin θ = sin α</text>
  <text x="300" y="80" font-size="10.5" fill="#0ea5e9">θ = nπ + (−1)ⁿα</text>
  <text x="300" y="102" font-size="10.5" fill="#475569">cos θ = cos α</text>
  <text x="300" y="116" font-size="10.5" fill="#16a34a">θ = 2nπ ± α</text>
  <text x="300" y="138" font-size="10.5" fill="#475569">tan θ = tan α</text>
  <text x="300" y="152" font-size="10.5" fill="#a855f7">θ = nπ + α</text>
  <text x="300" y="176" font-size="10.5" fill="#0f172a">Periods: sin, cos → 2π</text>
  <text x="300" y="192" font-size="10.5" fill="#0f172a">tan → π</text>
  <text x="30" y="248" font-size="10.5" fill="#475569">sin θ = 1/2 cuts the unit circle twice per revolution; add 2nπ for all solutions.</text>
</svg>
