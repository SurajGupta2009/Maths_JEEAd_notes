<svg viewBox="0 0 620 150" width="620" role="img" aria-label="Stars and bars example: 5 balls, 3 boxes">
        <style>
          .sw { font: 700 26px "Segoe UI", sans-serif; fill: #0b8f7a; }
          .sb { stroke: #c2255c; stroke-width: 4; }
          .sl { font: 600 12px "Segoe UI", sans-serif; fill: #46506a; }
        </style>
        <text class="sw" x="30" y="60">* * * | * | * * * * * * * * *</text>
        <line class="sb" x1="185" y1="30" x2="185" y2="66"/>
        <line class="sb" x1="240" y1="30" x2="240" y2="66"/>
        <rect x="10" y="80" width="235" height="34" rx="8" fill="#e7f6f3" stroke="#b7e4dc"/>
        <text class="sl" x="127" y="102" text-anchor="middle">box 1: 3 balls</text>
        <rect x="253" y="80" width="120" height="34" rx="8" fill="#e7f6f3" stroke="#b7e4dc"/>
        <text class="sl" x="313" y="102" text-anchor="middle">box 2: 1</text>
        <rect x="372" y="80" width="200" height="34" rx="8" fill="#e7f6f3" stroke="#b7e4dc"/>
        <text class="sl" x="472" y="102" text-anchor="middle">box 3: 6   (total 10 ✓)</text>
        <text class="sl" x="310" y="140" text-anchor="middle">Each placement of the 2 bars among the 12 symbols = one distribution.</text>
      </svg>