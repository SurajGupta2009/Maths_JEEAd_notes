<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="30" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="30" y1="200" x2="30" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="30,20 26,29 34,29" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">x</text>
  <text x="36" y="30" font-size="12" fill="#334155">y</text>
  <!-- unit square -->
  <rect x="60" y="140" width="60" height="60" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="66" y="132" font-size="11" fill="#0369a1">unit square</text>
  <!-- basis vectors e1, e2 -->
  <line x1="60" y1="200" x2="120" y2="200" stroke="#0369a1" stroke-width="1.6"/>
  <line x1="60" y1="200" x2="60" y2="140" stroke="#0369a1" stroke-width="1.6"/>
  <!-- image parallelogram: columns of A = [[1,2],[3,4]] -> (1,3) and (2,4) -->
  <polygon points="60,200 90,110 190,50 160,140" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="60" y1="200" x2="90" y2="110" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="90,110 80,113 85,121" fill="#dc2626"/>
  <line x1="60" y1="200" x2="190" y2="50" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="190,50 176,55 182,62" fill="#dc2626"/>
  <text x="96" y="106" font-size="11" fill="#b91c1c">A e₁</text>
  <text x="196" y="48" font-size="11" fill="#b91c1c">A e₂</text>
  <!-- area label -->
  <text x="250" y="130" font-size="12" fill="#0f172a">area = |det A|</text>
  <text x="250" y="148" font-size="11" fill="#475569">= |1·4 − 2·3| = 2</text>
  <text x="250" y="168" font-size="11" fill="#475569">det A &gt; 0: orientation kept</text>
  <text x="250" y="184" font-size="11" fill="#475569">det A &lt; 0: orientation flipped</text>
  <text x="30" y="230" font-size="11" fill="#475569">A matrix is a linear map: it sends the unit square to the parallelogram</text>
  <text x="30" y="246" font-size="11" fill="#475569">spanned by its columns. The determinant is the area scale factor.</text>
</svg>
