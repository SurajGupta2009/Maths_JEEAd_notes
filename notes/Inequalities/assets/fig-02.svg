<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <!-- hyperbola y = x + 1/x for x>0 -->
  <path d="M55,60 C90,150 130,178 170,182 C210,186 250,170 290,140 C330,110 370,80 420,62"
        fill="none" stroke="#0ea5e9" stroke-width="2.2"/>
  <text x="424" y="58" font-size="11" fill="#0369a1">y = x + 1/x</text>
  <!-- minimum at (1,2) -->
  <circle cx="105" cy="184" r="4" fill="#dc2626"/>
  <text x="112" y="180" font-size="12" fill="#dc2626">min 2 at x = 1</text>
  <!-- dashed lines to the minimum -->
  <line x1="105" y1="184" x2="105" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="105" y1="184" x2="40" y2="184" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- AM-GM annotation -->
  <text x="250" y="60" font-size="11" fill="#475569">x + 1/x ≥ 2√(x · 1/x) = 2</text>
  <text x="250" y="76" font-size="11" fill="#475569">equality iff x = 1/x, i.e. x = 1</text>
  <!-- trade-off box -->
  <text x="60" y="228" font-size="11" fill="#475569">Fixed sum → product maximised at equality. Fixed product → sum minimised.</text>
  <text x="60" y="244" font-size="11" fill="#475569">Both are AM–GM read in opposite directions.</text>
</svg>
