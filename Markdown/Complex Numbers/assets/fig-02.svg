<svg viewBox="0 0 620 360" width="620" role="img" aria-label="Complex plane: parallelogram law, difference vector, and a circle locus">
        <style>
          .ax { stroke: #94a3b8; stroke-width: 1.4; }
          .ar { stroke: #2a3550; stroke-width: 1.5; fill: none; }
          .vd { stroke: #0b8f7a; stroke-width: 2.2; fill: none; }
          .vm { stroke: #c2255c; stroke-width: 2.2; fill: none; }
          .ci { stroke: #6d3fd4; stroke-width: 2; fill: rgba(109,63,212,.07); }
          .lb { font: 600 13px "Segoe UI", sans-serif; fill: #2a3550; }
          .ls { font: 500 12px "Segoe UI", sans-serif; fill: #7a83a5; }
          .lg { font: 600 13px "Segoe UI", sans-serif; fill: #0b8f7a; }
          .lm { font: 600 13px "Segoe UI", sans-serif; fill: #c2255c; }
          .lv { font: 600 13px "Segoe UI", sans-serif; fill: #6d3fd4; }
        </style>
        <!-- axes (origin at 70,260; 1 unit = 55 px) -->
        <line class="ax" x1="30" y1="260" x2="590" y2="260"/>
        <line class="ax" x1="70" y1="330" x2="70" y2="30"/>
        <text class="ls" x="596" y="258">Re</text>
        <text class="ls" x="76" y="26">Im</text>
        <!-- z1 = (3,1) ; z2 = (1,2) ; z1+z2 = (4,3) ; z1-z2 = (2,-1) -->
        <line class="vd" x1="70" y1="260" x2="235" y2="205"/>
        <line class="vm" x1="70" y1="260" x2="125" y2="150"/>
        <line class="vd" x1="125" y1="150" x2="290" y2="95" stroke-dasharray="5 4"/>
        <line class="vm" x1="235" y1="205" x2="290" y2="95" stroke-dasharray="5 4"/>
        <line class="ar" x1="70" y1="260" x2="290" y2="95"/>
        <line class="ar" x1="70" y1="260" x2="180" y2="315" stroke-dasharray="3 4"/>
        <circle class="ci" cx="290" cy="95" r="55"/>
        <!-- vertices -->
        <circle cx="70" cy="260" r="4" fill="#2a3550"/>
        <circle cx="235" cy="205" r="4" fill="#0b8f7a"/>
        <circle cx="125" cy="150" r="4" fill="#c2255c"/>
        <circle cx="290" cy="95" r="4" fill="#2a3550"/>
        <circle cx="180" cy="315" r="4" fill="#2a3550"/>
        <!-- labels -->
        <text class="ls" x="58" y="278">O</text>
        <text class="lg" x="244" y="200">z₁ = 3+i</text>
        <text class="lm" x="36" y="144">z₂ = 1+2i</text>
        <text class="lb" x="300" y="86">z₁+z₂ = 4+3i</text>
        <text class="ls" x="190" y="322">z₁−z₂ = 2−i</text>
        <text class="lv" x="360" y="60">|z − (z₁+z₂)| = 1</text>
        <line class="lv" x1="358" y1="64" x2="325" y2="82" stroke-width="1"/>
        <text class="ls" x="120" y="345">green = z₁ · pink = z₂ · solid = sum (diagonal) · dashed = difference</text>
      </svg>