<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="30" y1="125" x2="450" y2="125" stroke="#334155" stroke-width="1.2"/>
  <line x1="60" y1="230" x2="60" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="450,125 442,121 442,129" fill="#334155"/>
  <polygon points="60,20 56,29 64,29" fill="#334155"/>
  <text x="452" y="141" font-size="12" fill="#334155">x</text>
  <text x="66" y="30" font-size="12" fill="#334155">y</text>
  <!-- circle 1: x^2+y^2=25, centre (0,0), r=5 -->
  <ellipse cx="60" cy="125" rx="160" ry="100" fill="#0ea5e9" fill-opacity="0.08" stroke="#0ea5e9" stroke-width="2"/>
  <!-- circle 2: (x-4)^2+y^2=16, centre (4,0), r=4 -->
  <ellipse cx="188" cy="125" rx="128" ry="80" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-width="2"/>
  <!-- centres -->
  <circle cx="60" cy="125" r="3.5" fill="#0f172a"/>
  <circle cx="188" cy="125" r="3.5" fill="#0f172a"/>
  <text x="46" y="140" font-size="11" fill="#0f172a">C₁(0,0)</text>
  <text x="196" y="140" font-size="11" fill="#0f172a">C₂(4,0)</text>
  <!-- radical axis x = 25/8 : vertical line -->
  <line x1="160" y1="25" x2="160" y2="225" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="166" y="40" font-size="11" fill="#16a34a">radical axis x = 25/8</text>
  <!-- intersection points (25/8, +-3.9031) -->
  <circle cx="160" cy="47" r="4" fill="#dc2626"/>
  <circle cx="160" cy="203" r="4" fill="#dc2626"/>
  <text x="166" y="48" font-size="11" fill="#dc2626">A</text>
  <text x="166" y="200" font-size="11" fill="#dc2626">B</text>
  <!-- common chord AB -->
  <line x1="160" y1="47" x2="160" y2="203" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="200" y="215" font-size="11" fill="#475569">AB = common chord = the radical axis</text>
  <text x="30" y="245" font-size="11" fill="#475569">Two intersecting circles: their common chord is the radical axis, perpendicular to the line of centres.</text>
</svg>
