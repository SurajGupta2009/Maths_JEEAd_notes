<svg viewBox="0 0 600 190" width="600" role="img" aria-label="Pigeonhole principle illustration">
        <style>
          .ph { font: 700 13px "Segoe UI", sans-serif; fill:#2a3550; }
          .pt { font: 600 11px "Segoe UI", sans-serif; fill:#6b7690; }
        </style>
        <!-- boxes -->
        <rect x="30" y="60" width="120" height="90" rx="10" fill="#fff" stroke="#364fc7" stroke-width="2"/>
        <rect x="170" y="60" width="120" height="90" rx="10" fill="#fff" stroke="#364fc7" stroke-width="2"/>
        <rect x="310" y="60" width="120" height="90" rx="10" fill="#fff" stroke="#364fc7" stroke-width="2"/>
        <text class="pt" x="90" y="168" text-anchor="middle">box 1</text>
        <text class="pt" x="230" y="168" text-anchor="middle">box 2</text>
        <text class="pt" x="370" y="168" text-anchor="middle">box 3</text>
        <!-- pigeons -->
        <circle cx="60" cy="105" r="12" fill="#0b8f7a"/><circle cx="90" cy="120" r="12" fill="#0b8f7a"/>
        <circle cx="115" cy="100" r="12" fill="#0b8f7a"/>
        <circle cx="200" cy="110" r="12" fill="#0b8f7a"/>
        <circle cx="400" cy="105" r="12" fill="#0b8f7a"/>
        <text class="ph" x="480" y="90">7 objects,</text>
        <text class="ph" x="480" y="110">3 boxes →</text>
        <text class="ph" x="480" y="130" fill="#c2255c">some box has at least 3</text>
        <text class="pt" x="480" y="152">(the left box realizes it)</text>
      </svg>