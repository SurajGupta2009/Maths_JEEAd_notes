<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="180" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,180 432,176 432,184" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <text x="444" y="184" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <!-- x tick marks for roots -->
  <line x1="130" y1="176" x2="130" y2="184" stroke="#334155" stroke-width="1"/>
  <line x1="330" y1="176" x2="330" y2="184" stroke="#334155" stroke-width="1"/>
  <text x="122" y="198" font-size="11" fill="#334155">α</text>
  <text x="322" y="198" font-size="11" fill="#334155">β</text>
  <!-- parabola D>0 -->
  <path d="M80,40 Q230,330 380,40" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="392" y="52" font-size="12" fill="#dc2626">D &gt; 0</text>
  <!-- vertex -->
  <circle cx="230" cy="128" r="3" fill="#dc2626"/>
  <text x="236" y="124" font-size="11" fill="#dc2626">vertex</text>
  <!-- axis -->
  <line x1="230" y1="60" x2="230" y2="180" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="234" y="76" font-size="10" fill="#b91c1c">x = −b/2a</text>
  <!-- labels for the three discriminant cases -->
  <text x="60" y="230" font-size="11" fill="#475569">D &gt; 0 : two distinct real roots (crosses twice)</text>
  <text x="60" y="244" font-size="11" fill="#475569">D = 0 : one repeated root (touches) · D &lt; 0 : no real roots (misses)</text>
</svg>
