<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="215" x2="450" y2="215" stroke="#334155" stroke-width="1.4"/>
  <line x1="60" y1="20" x2="60" y2="230" stroke="#334155" stroke-width="1.4"/>
  <polygon points="450,215 440,211 440,219" fill="#334155"/>
  <polygon points="60,20 56,30 64,30" fill="#334155"/>
  <text x="452" y="229" font-size="12" fill="#334155">x</text>
  <text x="66" y="30" font-size="12" fill="#334155">y</text>
  <!-- curve y = x^2 on [0,2] -->
  <path d="M60,215 L110,205 L160,175 L210,125 L260,55" fill="none" stroke="#0ea5e9" stroke-width="2.2"/>
  <!-- n = 4 rectangles (right endpoints) -->
  <rect x="60"  y="205" width="50" height="10" fill="#0ea5e9" fill-opacity="0.16" stroke="#0369a1" stroke-width="0.8"/>
  <rect x="110" y="175" width="50" height="40" fill="#0ea5e9" fill-opacity="0.16" stroke="#0369a1" stroke-width="0.8"/>
  <rect x="160" y="125" width="50" height="90" fill="#0ea5e9" fill-opacity="0.16" stroke="#0369a1" stroke-width="0.8"/>
  <rect x="210" y="55"  width="50" height="160" fill="#0ea5e9" fill-opacity="0.16" stroke="#0369a1" stroke-width="0.8"/>
  <text x="70" y="240" font-size="11" fill="#475569">n = 4 rectangles</text>
  <!-- labels -->
  <text x="270" y="52" font-size="12" fill="#0ea5e9">y = x²</text>
  <text x="270" y="95" font-size="11" fill="#0369a1">rectangles overshoot</text>
  <text x="270" y="112" font-size="11" fill="#0369a1">on the rising part</text>
  <text x="200" y="200" font-size="11" fill="#16a34a">area → 8/3</text>
  <text x="60" y="245" font-size="11" fill="#475569">As n → ∞ the sum of rectangle areas tends to ∫₀² x² dx = 8/3.</text>
</svg>
