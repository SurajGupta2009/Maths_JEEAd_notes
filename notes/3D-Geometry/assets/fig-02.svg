<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="470" height="250" font-family="Inter, Segoe UI, sans-serif">
  <rect width="470" height="250" fill="#ffffff"/>
  <!-- axes -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="20" stroke="#334155" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="150" y2="235" stroke="#334155" stroke-width="1.2"/>
  <polygon points="440,200 432,196 432,204" fill="#334155"/>
  <polygon points="40,20 36,29 44,29" fill="#334155"/>
  <polygon points="150,235 141,232 144,224" fill="#334155"/>
  <text x="444" y="204" font-size="12" fill="#334155">x</text>
  <text x="46" y="30" font-size="12" fill="#334155">y</text>
  <text x="152" y="240" font-size="12" fill="#334155">z</text>
  <!-- sphere (centre C, radius R) -->
  <circle cx="250" cy="110" r="70" fill="#0ea5e9" fill-opacity="0.07" stroke="#0284c7" stroke-width="1.6"/>
  <circle cx="250" cy="110" r="3.5" fill="#0f172a"/>
  <text x="256" y="106" font-size="13" fill="#0f172a">C</text>
  <!-- radius to a point on the sphere -->
  <line x1="250" y1="110" x2="196" y2="58" stroke="#0284c7" stroke-width="1.4"/>
  <text x="212" y="76" font-size="11" fill="#0369a1">R</text>
  <!-- the cutting plane (drawn as a parallelogram) -->
  <polygon points="140,140 380,140 420,178 180,178" fill="#f59e0b" fill-opacity="0.12" stroke="#d97706" stroke-width="1.6"/>
  <text x="392" y="136" font-size="12" fill="#b45309">plane</text>
  <!-- foot of perpendicular = centre of section circle -->
  <line x1="250" y1="110" x2="270" y2="158" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="270,158 262,153 265,145" fill="#dc2626"/>
  <circle cx="270" cy="158" r="3.5" fill="#dc2626"/>
  <text x="278" y="152" font-size="12" fill="#dc2626">F</text>
  <!-- right angle marker at F -->
  <path d="M262,150 L266,144 L272,148" fill="none" stroke="#475569" stroke-width="1.1"/>
  <!-- section circle -->
  <ellipse cx="270" cy="158" rx="52" ry="17" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="326" y="162" font-size="12" fill="#dc2626">r = √(R² − d²)</text>
  <!-- d label on CF -->
  <line x1="252" y1="112" x2="268" y2="156" stroke="#475569" stroke-width="1"/>
  <text x="240" y="140" font-size="11" fill="#475569">d</text>
  <!-- annotations -->
  <text x="40" y="248" font-size="11" fill="#475569">A plane at distance d from the centre cuts a circle whose centre F is the foot of the perpendicular.</text>
  <text x="290" y="205" font-size="11" fill="#475569">d &lt; R → circle</text>
  <text x="290" y="219" font-size="11" fill="#475569">d = R → one point</text>
  <text x="290" y="233" font-size="11" fill="#475569">d &gt; R → no contact</text>
</svg>
