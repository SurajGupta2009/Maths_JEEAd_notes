name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the Markdown notes (frontmatter, math balance, blocks, image links)
        run: python3 tools/verify-md.py

      - name: Verify the vault structure (6 chapters/module, unique names, P/S numbering)
        run: python3 tools/verify-structure.py
